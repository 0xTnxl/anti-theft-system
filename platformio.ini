; Anti-theft door security system firmware, hardware Rev B (wiring unchanged).
;
; Targets platform espressif32 6.13.0 = Arduino-ESP32 2.0.17, the version
; installed on the dev machine (no network access for pioarduino / 3.x).
; Arduino-ESP32 3.x is NOT supported yet: the ESP-NOW receive callback and
; LEDC APIs changed. See docs/OPEN_QUESTIONS.md #14.
;
; Before the first build run:  python3 tools/gen_keys.py
; Always pick the port by board MAC (USB port numbers change):
;   pio run -e <env> -t upload --upload-port $(python3 tools/find_port.py <exterior|interior>)
;
;   exterior            production exterior (keypad / RFID / OLED)
;   interior            production interior (servo / sensors / alarm)
;   exterior_test       TEST ONLY: serial "auth" hook + 60 s rekey, for tools/link_test.py
;   exterior_selftest   component kick test, exterior board
;   interior_selftest   component kick test, interior board (also servo calibration)
; See docs/TESTING.md.

[platformio]
default_envs = exterior, interior

[env]
platform = espressif32@6.13.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; Keep DTR/RTS released so opening the monitor does not reset or hold the board.
monitor_dtr = 0
monitor_rts = 0
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_flags = -Wall -Wextra

[env:exterior]
build_src_filter = +<exterior/>

[env:interior]
build_src_filter = +<interior/>

[env:exterior_test]
build_src_filter = +<exterior/>
build_flags = ${env.build_flags} -DATDS_TEST_HOOKS -DSLINK_REKEY_INTERVAL_MS=60000

[env:exterior_selftest]
build_src_filter = +<exterior_selftest/> +<exterior/oled.cpp> +<exterior/rc522.cpp> +<exterior/keypad.cpp>
build_flags = ${env.build_flags} -Isrc/exterior

[env:interior_selftest]
build_src_filter = +<interior_selftest/>
