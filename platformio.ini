; Anti-theft door security system firmware, hardware Rev B (wiring unchanged).
;
; Targets platform espressif32 6.13.0 = Arduino-ESP32 2.0.17, the version
; installed on the dev machine (no network access for pioarduino / 3.x).
; Arduino-ESP32 3.x is NOT supported yet: the ESP-NOW receive callback and
; LEDC APIs changed. See docs/OPEN_QUESTIONS.md #14.
;
; Before the first build run:  python3 tools/gen_keys.py
;
;   pio run -e exterior -t upload      exterior (keypad / RFID / OLED) board
;   pio run -e interior -t upload      interior (servo / sensors) board
;   pio run -e interior_diag -t upload sensor + servo calibration build

[platformio]
default_envs = exterior, interior

[env]
platform = espressif32@6.13.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_flags = -Wall -Wextra

[env:exterior]
build_src_filter = +<exterior/>

[env:interior]
build_src_filter = +<interior/>

[env:interior_diag]
build_src_filter = +<interior_diag/>
